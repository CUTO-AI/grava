name: Deploy (SSH netcup)

# Deployt bei jedem Push auf main auf den netcup-Prod-Server (cyberride.world).
# Der Server hat vollen Shell-Zugriff (SSH, git, composer, echtes Cron), zieht
# also selbst per git + composer und wendet Migrationen an. Ersetzt den alten
# SFTP-Deploy auf die (auslaufende) IONOS-Instanz.
#
# Login als non-root-User (armin), Rechte-Eskalation je Befehl via sudo
# (NOPASSWD) — kein root-SSH-Login nötig. App-CLI läuft als www-data (wie Cron).
#
# Auslöser: Push auf main + manuell ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# Zwei Deploys nie überlappen lassen.
concurrency:
  group: netcup-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH-Deploy auf netcup
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.NETCUP_SSH_HOST }}
          username: ${{ secrets.NETCUP_SSH_USER }}
          key: ${{ secrets.NETCUP_SSH_KEY }}
          port: ${{ secrets.NETCUP_SSH_PORT }}
          envs: GITHUB_SHA
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/app
            # Aktuellen main-Stand holen und hart darauf setzen (verwirft Drift).
            # KEIN git clean — untracked Server-Secrets (.env*, *.p8, storage/keys)
            # bleiben unangetastet.
            sudo git fetch --all --prune
            sudo git reset --hard origin/main
            sudo composer install --no-dev --optimize-autoloader --no-interaction
            # Versions-Marker für /healthz (kein .git-abhängiges Lesen zur Laufzeit).
            printf '{"commit":"%s","short":"%s","built_at":"%s","ref":"main"}\n' \
              "$GITHUB_SHA" "$(echo "$GITHUB_SHA" | cut -c1-7)" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | sudo tee VERSION >/dev/null
            # Migrationen als Laufzeit-User anwenden (idempotent; .env ist 640 root:www-data).
            sudo -u www-data php public/index.php cli:migrate
            # Async-Ingest-Worker als Cron einrichten (idempotent). Eigene
            # cron.d-Datei (Name ohne Punkt, sonst ignoriert cron sie), damit die
            # bestehende User-crontab unangetastet bleibt. Läuft als www-data.
            printf '%s\n' '* * * * * www-data php /var/www/app/public/index.php game:ingest-run >/dev/null 2>&1' \
              | sudo tee /etc/cron.d/gravelexplorer-ingest >/dev/null
            sudo chmod 0644 /etc/cron.d/gravelexplorer-ingest
            # Cleanup/Retention (u. a. Cron-Lauf-Historie prunen + stuck-Läufe reifen) täglich 03:45.
            printf '%s\n' '45 3 * * * www-data php /var/www/app/public/index.php cron:cleanup >/dev/null 2>&1' \
              | sudo tee /etc/cron.d/gravelexplorer-cleanup >/dev/null
            sudo chmod 0644 /etc/cron.d/gravelexplorer-cleanup
            # Broadcast-Push-Worker (Admin-Broadcasts, entkoppelt) jede Minute.
            printf '%s\n' '* * * * * www-data php /var/www/app/public/index.php game:broadcast-run >/dev/null 2>&1' \
              | sudo tee /etc/cron.d/gravelexplorer-broadcast >/dev/null
            sudo chmod 0644 /etc/cron.d/gravelexplorer-broadcast
            # Nordstern-Aktivitäts-Cache (WAR/Region, 7/30 Tage) täglich 03:50.
            printf '%s\n' '50 3 * * * www-data php /var/www/app/public/index.php game:region-activity-refresh >/dev/null 2>&1' \
              | sudo tee /etc/cron.d/gravelexplorer-region-activity >/dev/null
            sudo chmod 0644 /etc/cron.d/gravelexplorer-region-activity
            # PHP-Upload-Limits an die App-Grenze (REQUEST_MAX_UPLOAD_BYTES = 25 MB)
            # angleichen. Debian-Defaults (upload_max_filesize 2M / post_max_size 8M)
            # brechen große Routen-GPX ab, BEVOR die App-Prüfung greift — $_FILES
            # kommt dann leer an und der Upload meldet irreführend "payload fehlt".
            # post_max_size > upload_max_filesize (multipart-Overhead + Formfelder).
            printf '%s\n' \
              'upload_max_filesize = 32M' \
              'post_max_size = 40M' \
              | sudo tee /etc/php/8.4/fpm/conf.d/90-cyberride-uploads.ini >/dev/null
            sudo chmod 0644 /etc/php/8.4/fpm/conf.d/90-cyberride-uploads.ini
            # OPcache/FPM neu laden, damit der neue Code + INI-Limits sofort greifen.
            sudo systemctl reload php8.4-fpm
